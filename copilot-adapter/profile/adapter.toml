# Stock public PMx Harness adapter. Edit the profile and regenerate.
schema = 1

[project]
name = "pmx-harness"
summary = "A human-reviewed pharmacometrics workflow with deterministic computation."
principal = "SME"
depth_docs = ["CLAUDE.md", "docs/PORTABILITY.md"]
roles_dir = "roles"
dispatch_map_doc = "docs/PORTABILITY.md"
contract = "contract.md"

[orchestrator]
inline_mandate = true
reviewer_role = "pmx-reviewer"
evidence_artifacts = "engine log, targets store, file"

[protection]
preamble = """The repository-local PreToolUse guard is wired in `.claude/settings.json`
and `.github/hooks/pmx-harness.json`. Hook availability depends on the host's
settings and policy. The guard covers editor-tool calls. Terminal commands
run outside that interception. The pipeline verifies live artifact and
manifest digests and ledger chains independently. The guard uses PyYAML to
identify manifest-bound tools and refuses edits to `tools/*.R` when that
dependency set cannot be established. Do not edit:"""

[[do_not_edit]]
path = "gates/**"
reason = "Use the local gate tools for drafts, signed records, approvals and errata. The owner supplies the signature. This category is never unlocked."

[[do_not_edit]]
path = ["pipeline/compose.R", "tools/gate.R", "tools/gate_package.R", "tools/method_manifest.R", "tools/legacy_gates.yaml", "tools/approve_gate.R", "tools/load_reference.R", "tools/ci_check.R", "tools/errata.R", "tools/sign_approve_gate.R"]
reason = "Protects gate composition, signed records, the legacy validation boundary, both ledgers, byte-bound methods and CI checks. Changes require the owner's temporary local unlock."

[[do_not_edit]]
path = ".claude/hooks/**"
reason = "The owner controls the hooks and the .harness-unlock file from a terminal."

[[do_not_edit]]
path = ["skills/**/reference/**", "skills/**/MANIFEST.yaml", "tools/*.R"]
reason = "Obtain the owner's authorization for changes to reviewed reference source or manifests and manifest-bound tools. Regenerate affected method bindings and obtain a fresh local review."

[[instructions]]
slug = "gates"
apply_to = "gates/**"
name = "Gate records are read-only"
description = "The reviewer signs from the local gate tools."
body = "instructions/gates.md"

[[instructions]]
slug = "reference-code"
apply_to = "skills/**/reference/**"
name = "Reference code and method manifests"
description = "Check the method manifest and its local review before executing reference code."
body = "instructions/reference-code.md"

[[instructions]]
slug = "task-modules"
apply_to = "pipeline/tasks/**"
name = "Task-module contract"
description = "Declare task inputs, compute through targets, and build evidence with typed notes."
body = "instructions/task-modules.md"

[hooks]
file = "pmx-harness"
pre_tool_use = "python3 .claude/hooks/protect_paths.py"
session_start = "python3 .claude/hooks/session_mandate.py"
timeout_sec = 10

[agents]
source_dir = ".claude/agents"
glob = "pmx-*.md"
disable_model_invocation = ["pmx-reviewer"]
disable_agent_file_locations = [".claude/agents"]

[agents.models]
opus = "Claude Opus 4.8"
sonnet = "Claude Sonnet 4.5"
haiku = "Claude Haiku 4.5"

[agents.tools]
Read = "read"
Write = "edit"
Edit = "edit"
Grep = "search"
Glob = "search"
Bash = "execute"

[agents.orchestrator]
name = "pmx-orchestrator"
description = "Routes work to PMx specialists, verifies their evidence, and presents gate decisions to the SME."
role_file = "roles/orchestrator.md"
dispatch_map_doc = "docs/PORTABILITY.md"
dispatch_map_heading = "## Dispatch map"
model = "opus"
tools = ["agent", "read", "search", "execute", "edit"]
review_note = """Dispatch `pmx-reviewer` as an independent subagent. Each specialist
lists `agents: []`; the reviewer is not automatically invocable by generated specialists.
The orchestrator explicitly lists the available agents.
The owner can select `@pmx-reviewer` directly in a fresh chat. Reviewer
isolation is procedural whenever shell execution or unguarded file editing
is available. Record the model reported by the runtime or `unreported`."""

# One shim for each runtime-neutral skill under skills/.
[[skills]]
name = "baseline-fit"
description = "Use for declared baseline input custody and conditional raw estimation evidence. The baseline method is draft and refuses to run until signed."

[[skills]]
name = "covariate-priors"
description = "Use when building or reviewing a covariate model: the SME physiological prior list is frozen before any search, and the search (SCM, FREM, or prior-driven full model) runs only within it — the countermeasure to OFV-chasing covariate work."

[[skills]]
name = "data-assembly"
description = "Use when assembling the analysis-ready PK/PD dataset from source data: NONMEM-ready derivation steps, the QC battery, and the data specification, every step run as a targets target."

[[skills]]
name = "diagnostics"
description = "Use when producing or judging model diagnostics: goodness-of-fit, VPC, NPDE, and bootstrap batteries with declared diagnostic settings, for per-run modeler diagnostics and the risk-scaled qualification stage."

[[skills]]
name = "eda-standards"
description = "Use when producing exploratory data analysis for a PK/PD dataset: the standard tables, figures, and observations memo, all executed through the pipeline."

[[skills]]
name = "forest-plots"
description = "Use when a covariate-effect forest plot is needed: PMXForest-based rendering of covariate effects with uncertainty and reference bands, as declared in the analysis plan."

[[skills]]
name = "knowledge-base"
description = "Use when a pharmacometric question needs primary pharmacometrics literature or a site-provided knowledge source. Record citations and route decisions to the SME."

[[skills]]
name = "midd-framing"
description = "Use at the start and close-out of a regulatory-facing analysis: ICH M15 framing — question of interest, context of use, model risk rating, Model Analysis Plan, and the assessment table."

[[skills]]
name = "model-management"
description = "Use when creating, numbering, or tracing model runs: the bbr YAML metadata, numbered runs, based_on lineage, and run-record discipline for the modeling and covariate stages."

[[skills]]
name = "nonmem-estimation"
description = "Use when submitting or reading a NONMEM estimation run through bbr/bbi: engine configuration, run submission, result extraction, and the engine-parity evidence that must accompany every run."

[[skills]]
name = "psn-simeval"
description = "Use when running the PsN simulation-evaluation family (vpc, npc, sse) on a NONMEM model: which units require local review, their arguments, and how results enter the pipeline."

[[skills]]
name = "psn-uncertainty"
description = "Use when quantifying parameter uncertainty with PsN (bootstrap, sir, llp, nonpb, mcmp): which units require local review, what the MAP must declare, and how results enter the pipeline."

[[skills]]
name = "reference-models"
description = "Use when a NONMEM control stream is needed: adapt a template from the unsigned starter library via bbr and model_diff, never write one from scratch; a structure the library lacks is flagged NOVEL at the gate."

[[skills]]
name = "reporting-standards"
description = "Use when assembling the Model Analysis Report and summary deck from gated artifacts: the ICH M15 Appendix 2 structure, Quarto rendering, and the declared project reporting controls."

[[skills]]
name = "review-checklist"
description = "Use when performing the independent review of an analysis: the SME's review criteria, severity scale, fresh-store reproduction, and how findings are routed to their owning stage."

[[skills]]
name = "simulation-standards"
description = "Use when executing declared simulation scenarios from a qualified model with mrgsolve: recorded seeds, uncertainty propagation, and the declared simulation settings."

[editor]
markdown_byte_exact = true
terminal_deny_dirs = ["gates"]
rationale = """Gate signatures bind exact generated bytes. Preserve Markdown formatting on
save and apply signatures through the documented local process."""
editorconfig_rationale = "Gate signatures bind exact generated bytes. Preserve Markdown whitespace."
editorconfig_extra = """[*.R]
indent_style = space
indent_size = 2"""

[[standing_rules]]
text = "Store real study data and site credentials outside the repository. Declare local paths in the ignored site configuration."

[[standing_rules]]
text = "Run installation, export, reproduction, and report verification on disposable copies."

[[standing_rules]]
text = "Read the producing log or artifact when a wrapper suppresses diagnostics. Quote the command and decisive output from each check."

